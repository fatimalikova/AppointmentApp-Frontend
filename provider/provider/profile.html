<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profil — Provider Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/provider.css">
  <style>
    .profile-section-label {
      font-size:var(--fs-xs);font-weight:700;
      text-transform:uppercase;letter-spacing:.07em;
      color:var(--ink-soft);margin-bottom:var(--sp-4);
      display:flex;align-items:center;gap:7px;
    }
    .profile-section-label i { color:var(--accent); }
    .social-input-wrap { position:relative; }
    .social-input-prefix {
      position:absolute;left:12px;top:50%;transform:translateY(-50%);
      font-size:var(--fs-sm);color:var(--ink-soft);
      pointer-events:none;white-space:nowrap;
    }
    .social-input-wrap input { padding-left:130px; }
    .social-input-wrap.short input { padding-left:112px; }

    /* ── Cover + Avatar overlap ── */
    .cover-avatar-wrap {
      position:relative;
      margin-bottom:70px;
    }
    .cover-upload-zone {
      height:180px;border-radius:var(--r-md);
      overflow:hidden;background:linear-gradient(135deg,#082627,#0f2b2b,#1a4040);
      display:flex;align-items:center;justify-content:center;
      border:1.5px dashed var(--border);cursor:pointer;
      background-size:cover;background-position:center;
      transition:border-color .18s ease;
      position:relative;
    }
    .cover-upload-zone:hover { border-color:var(--accent); }
    .cover-upload-empty {
      text-align:center;color:rgba(255,255,255,.6);
      pointer-events:none;
    }
    .cover-upload-empty i { font-size:1.6rem;display:block;margin-bottom:6px; }
    .cover-upload-empty span { font-size:var(--fs-xs); }

    .profile-avatar-overlap {
      position:absolute;
      bottom:-60px;
      left:50%;
      transform:translateX(-50%);
      cursor:pointer;
      z-index:5;
    }
    .avatar-circle {
      width:120px;height:120px;border-radius:50%;
      background:var(--accent-soft);color:var(--accent-dark);
      display:flex;align-items:center;justify-content:center;
      font-size:var(--fs-2xl);font-weight:700;
      border:4px solid #fff;
      box-shadow:0 6px 20px rgba(0,0,0,.15);
      overflow:hidden;
      transition:transform .18s ease;
    }
    .profile-avatar-overlap:hover .avatar-circle { transform:scale(1.03); }
    .avatar-camera-badge {
      position:absolute;bottom:6px;right:6px;
      width:32px;height:32px;background:var(--accent);
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      border:2px solid #fff;color:#fff;font-size:.7rem;
    }

    .profile-name-block {
      text-align:center;margin-bottom:var(--sp-6);
    }
    .profile-name-block .name-actions {
      display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap;
    }
  </style>
</head>
<body>
<div class="shell">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">Biznes Profili</div>
        <div class="topbar-sub" id="topbarSub"></div>
      </div>
    </div>

    <div class="content" style="max-width:780px">
      <div class="page-header">
        <div>
          <h1>Biznes Profili</h1>
          <p>Biznes məlumatlarınızı idarə edin</p>
        </div>
      </div>

      <div class="alert hidden" id="alertBox"></div>

      <!-- Status banner -->
      <div id="statusBanner" class="hidden"
        style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4);
               border-radius:var(--r-md);margin-bottom:var(--sp-5);border:1px solid"></div>

      <form id="profileForm">

        <!-- ══ KART 1: Cover + Avatar + Əsas ══ -->
        <div class="card" style="margin-bottom:var(--sp-4)">

          <!-- Cover + Avatar overlap -->
          <div class="cover-avatar-wrap">
            <div id="coverPreviewWrap" class="cover-upload-zone" onclick="document.getElementById('coverFile').click()">
              <div class="cover-upload-empty" id="coverEmptyState">
                <i class="fa-solid fa-image"></i>
                <span>Örtük şəkli əlavə etmək üçün klikləyin</span>
              </div>
            </div>

            <div class="profile-avatar-overlap" onclick="document.getElementById('photoFile').click()">
              <div id="avatarEl" class="avatar-circle">?</div>
              <div class="avatar-camera-badge">
                <i class="fa-solid fa-camera"></i>
              </div>
            </div>
          </div>

          <input type="file" id="coverFile" accept="image/*" style="display:none" onchange="handleCoverSelect(this)">
          <input type="file" id="photoFile" accept="image/*" style="display:none" onchange="handlePhotoSelect(this)">

          <!-- Ad + kateqoriya + status mesajları -->
          <div class="profile-name-block">
            <b id="avatarName" style="font-size:var(--fs-lg);display:block;margin-bottom:3px">—</b>
            <span id="avatarCat" style="font-size:var(--fs-sm);color:var(--ink-soft)"></span>
            <div id="uploadStatus" style="font-size:var(--fs-xs);color:var(--ink-soft);margin-top:6px"></div>
            <div id="coverUploadStatus" style="font-size:var(--fs-xs);color:var(--ink-soft);margin-top:2px"></div>
            <div class="name-actions">
              <button type="button" id="removePhotoBtn" class="btn btn-danger btn-xs hidden" onclick="removePhoto()">
                <i class="fa-solid fa-trash"></i> Profil şəklini sil
              </button>
              <button type="button" id="removeCoverBtn" class="btn btn-danger btn-xs hidden" onclick="removeCover()">
                <i class="fa-solid fa-trash"></i> Örtük şəklini sil
              </button>
            </div>
          </div>

          <!-- Biznes adı + Kateqoriya -->
          <div class="profile-section-label">
            <i class="fa-solid fa-building"></i> Əsas məlumatlar
          </div>

          <div class="field-row">
            <div class="field">
              <label><i class="fa-solid fa-building" style="color:var(--accent);margin-right:6px"></i>Biznes adı</label>
              <input type="text" id="businessName" required placeholder="Məs. Bella Hair Salon">
            </div>
            <div class="field">
              <label><i class="fa-solid fa-tag" style="color:var(--accent);margin-right:6px"></i>Kateqoriya</label>
              <select id="category" required onchange="handleCategoryChange()">
                <option value="" disabled selected>Seçin...</option>
                <option>Stomatoloq</option>
                <option>Gözəllik salonu</option>
                <option>Bərbərxana</option>
                <option>Masaj</option>
                <option>Repetitor</option>
                <option>Psixoloq</option>
                <option>Hüquqşünas</option>
                <option value="other">Digər...</option>
              </select>
            </div>
          </div>

          <div class="field hidden" id="customCategoryField">
            <label><i class="fa-solid fa-pen" style="color:var(--accent);margin-right:6px"></i>Kateqoriyanızı daxil edin</label>
            <input type="text" id="customCategory" placeholder="Məs. Fizioterapevt, Dietoloq...">
          </div>

          <div class="field">
            <label><i class="fa-solid fa-align-left" style="color:var(--accent);margin-right:6px"></i>Təsvir</label>
            <textarea id="description" rows="3"
              placeholder="Biznesiniz haqqında qısa məlumat — xidmətlər, təcrübə, üstünlüklər..."></textarea>
          </div>

          <div class="field">
            <label><i class="fa-solid fa-location-dot" style="color:var(--accent);margin-right:6px"></i>Ünvan</label>
            <input type="text" id="address" placeholder="Bakı, Nərimanov rayonu, Əliağa Vahid 12">
          </div>
        </div>

        <!-- ══ KART 2: Əlaqə ══ -->
        <div class="card" style="margin-bottom:var(--sp-4)">
          <div class="profile-section-label">
            <i class="fa-solid fa-address-card"></i> Əlaqə məlumatları
          </div>

          <div class="field-row">
            <div class="field">
              <label><i class="fa-solid fa-phone" style="color:var(--accent);margin-right:6px"></i>Telefon nömrəsi</label>
              <input type="tel" id="phoneNumber" placeholder="+994 50 123 45 67">
              <span class="field-hint">Müştərilər bu nömrə ilə əlaqə saxlaya bilər</span>
            </div>
            <div class="field">
              <label><i class="fa-solid fa-envelope" style="color:var(--accent);margin-right:6px"></i>Əlaqə email</label>
              <input type="email" id="contactEmail" placeholder="biznes@email.com">
              <span class="field-hint">Hesab email-dən fərqli ola bilər</span>
            </div>
          </div>
        </div>

        <!-- ══ KART 3: Sosial media ══ -->
        <div class="card" style="margin-bottom:var(--sp-5)">
          <div class="profile-section-label">
            <i class="fa-solid fa-share-nodes"></i> Sosial media <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-soft);font-size:var(--fs-xs)">(istəyə görə)</span>
          </div>

          <div class="field">
            <label>
              <i class="fa-brands fa-instagram" style="color:#E1306C;margin-right:6px"></i>Instagram
            </label>
            <div class="social-input-wrap">
              <span class="social-input-prefix">instagram.com/</span>
              <input type="text" id="instagramUrl" placeholder="hesabiniz">
            </div>
          </div>

          <div class="field">
            <label>
              <i class="fa-brands fa-facebook" style="color:#1877F2;margin-right:6px"></i>Facebook
            </label>
            <div class="social-input-wrap short">
              <span class="social-input-prefix">facebook.com/</span>
              <input type="text" id="facebookUrl" placeholder="hesabiniz">
            </div>
          </div>

          <!-- Doldurulmuş sosialların preview -->
          <div id="socialPreview" class="hidden"
            style="display:flex;gap:var(--sp-3);margin-top:var(--sp-2);flex-wrap:wrap">
          </div>
        </div>

        <!-- Saxla -->
        <div style="display:flex;gap:var(--sp-3)">
          <button type="submit" class="btn btn-primary" id="saveBtn">
            <i class="fa-solid fa-floppy-disk"></i> Yadda saxla
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="../js/provider-api.js"></script>
<script src="../js/layout.js"></script>
<script>
  let isNew = false;
  let uploadedImageUrl = '';
  let uploadedCoverUrl = '';

  /* ── Kateqoriya ── */
  function handleCategoryChange() {
    const val = document.getElementById('category').value;
    const cf  = document.getElementById('customCategoryField');
    if (val === 'other') {
      cf.classList.remove('hidden');
      document.getElementById('customCategory').focus();
    } else {
      cf.classList.add('hidden');
      document.getElementById('customCategory').value = '';
    }
  }

  function getCategoryValue() {
    const v = document.getElementById('category').value;
    return v === 'other'
      ? document.getElementById('customCategory').value.trim()
      : v;
  }

  /* ── Sosial URL helper-ləri ── */
  function getSocialValue(id, prefix) {
    const val = document.getElementById(id).value.trim();
    if (!val) return undefined;
    if (val.startsWith('http')) return val;
    return prefix + val;
  }

  function setSocialValue(id, prefix, fullUrl) {
    if (!fullUrl) { document.getElementById(id).value = ''; return; }
    document.getElementById(id).value = fullUrl
      .replace(/^https?:\/\/(www\.)?/, '')
      .replace(prefix.replace(/^https?:\/\/(www\.)?/, ''), '');
  }

  function updateSocialPreview() {
    const ig = document.getElementById('instagramUrl').value.trim();
    const fb = document.getElementById('facebookUrl').value.trim();
    const prev = document.getElementById('socialPreview');
    const links = [];
    if (ig) links.push(`<a href="https://instagram.com/${ig}" target="_blank"
      style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;
             background:#fdecea;color:#E1306C;border-radius:var(--r-full);
             font-size:var(--fs-xs);font-weight:600;text-decoration:none">
      <i class="fa-brands fa-instagram"></i> @${ig}
    </a>`);
    if (fb) links.push(`<a href="https://facebook.com/${fb}" target="_blank"
      style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;
             background:#e3f0fa;color:#1877F2;border-radius:var(--r-full);
             font-size:var(--fs-xs);font-weight:600;text-decoration:none">
      <i class="fa-brands fa-facebook"></i> ${fb}
    </a>`);
    if (links.length) {
      prev.innerHTML = links.join('');
      prev.style.display = 'flex';
      prev.classList.remove('hidden');
    } else {
      prev.classList.add('hidden');
    }
  }

  document.getElementById('instagramUrl').addEventListener('input', updateSocialPreview);
  document.getElementById('facebookUrl').addEventListener('input', updateSocialPreview);

  /* ── Örtük (cover) şəkli seç ── */
  async function handleCoverSelect(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showAlert('#alertBox', 'Şəkil 5MB-dan böyük ola bilməz.');
      return;
    }
    const statusEl = document.getElementById('coverUploadStatus');
    statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Yüklənir...';

    const reader = new FileReader();
    reader.onload = e => {
      const zone = document.getElementById('coverPreviewWrap');
      zone.style.backgroundImage = `url('${e.target.result}')`;
      document.getElementById('coverEmptyState').style.display = 'none';
    };
    reader.readAsDataURL(file);

    try {
      const fd = new FormData();
      fd.append('image', file);
      const res  = await fetch('https://api.imgbb.com/1/upload?key=cfb112e9e8b779f0c69925b074355c2c',
        { method:'POST', body:fd });
      const data = await res.json();
      if (data.success) {
        uploadedCoverUrl = data.data.url;
        statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--success)"></i> Örtük şəkli yükləndi';
        document.getElementById('removeCoverBtn').classList.remove('hidden');
      } else throw new Error();
    } catch {
      uploadedCoverUrl = '';
      statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:var(--warning)"></i> Yükləmə uğursuz';
    }
  }

  function removeCover() {
    uploadedCoverUrl = '';
    const zone = document.getElementById('coverPreviewWrap');
    zone.style.backgroundImage = 'none';
    document.getElementById('coverEmptyState').style.display = 'block';
    document.getElementById('removeCoverBtn').classList.add('hidden');
    document.getElementById('coverUploadStatus').innerHTML =
      '<i class="fa-solid fa-circle-info" style="color:var(--ink-soft)"></i> Örtük şəkli silinəcək — formu saxlayın';
  }

  /* ── Şəkil seç (avatar) ── */
  async function handlePhotoSelect(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showAlert('#alertBox', 'Şəkil 5MB-dan böyük ola bilməz.');
      return;
    }
    const statusEl = document.getElementById('uploadStatus');
    statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Yüklənir...';

    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('avatarEl').innerHTML =
        `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    };
    reader.readAsDataURL(file);

    try {
      const fd = new FormData();
      fd.append('image', file);
      const res  = await fetch('https://api.imgbb.com/1/upload?key=cfb112e9e8b779f0c69925b074355c2c',
        { method:'POST', body:fd });
      const data = await res.json();
      if (data.success) {
        uploadedImageUrl = data.data.url;
        statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--success)"></i> Şəkil yükləndi';
        document.getElementById('removePhotoBtn').classList.remove('hidden');
      } else throw new Error();
    } catch {
      uploadedImageUrl = '';
      statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:var(--warning)"></i> Yükləmə uğursuz';
    }
  }

  function removePhoto() {
    uploadedImageUrl = '';
    const name = document.getElementById('businessName').value;
    document.getElementById('avatarEl').textContent = name?.[0] || '?';
    document.getElementById('removePhotoBtn').classList.add('hidden');
    document.getElementById('uploadStatus').innerHTML =
      '<i class="fa-solid fa-circle-info" style="color:var(--ink-soft)"></i> Şəkil silinəcək — formu saxlayın';
  }

  /* ── Profil yüklə ── */
  async function loadProfile() {
    try {
      const p = await pApi.getMyProfile();

      document.getElementById('businessName').value = p.businessName || '';
      document.getElementById('description').value  = p.description  || '';
      document.getElementById('address').value      = p.address      || '';
      document.getElementById('phoneNumber').value  = p.phoneNumber  || '';
      document.getElementById('contactEmail').value = p.contactEmail || '';

      /* Sosial */
      setSocialValue('instagramUrl', 'instagram.com/', p.instagramUrl);
      setSocialValue('facebookUrl',  'facebook.com/',  p.facebookUrl);
      updateSocialPreview();

      /* Kateqoriya */
      const cat    = p.category || '';
      const select = document.getElementById('category');
      const known  = Array.from(select.options).map(o => o.value).filter(v => v && v !== 'other');
      if (cat && !known.includes(cat)) {
        select.value = 'other';
        document.getElementById('customCategoryField').classList.remove('hidden');
        document.getElementById('customCategory').value = cat;
      } else {
        select.value = cat;
      }

      /* Avatar */
      uploadedImageUrl = p.imageUrl || '';
      const avatarEl   = document.getElementById('avatarEl');
      if (p.imageUrl) {
        avatarEl.innerHTML = `<img src="${p.imageUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
        document.getElementById('removePhotoBtn').classList.remove('hidden');
      } else {
        avatarEl.textContent = p.businessName?.[0] || '?';
        document.getElementById('removePhotoBtn').classList.add('hidden');
      }
      document.getElementById('avatarName').textContent = p.businessName || '—';
      document.getElementById('avatarCat').textContent  = p.category     || '';
      document.getElementById('uploadStatus').innerHTML = '';

      /* Cover */
      uploadedCoverUrl = p.coverImageUrl || '';
      const coverZone  = document.getElementById('coverPreviewWrap');
      if (p.coverImageUrl) {
        coverZone.style.backgroundImage = `url('${p.coverImageUrl}')`;
        document.getElementById('coverEmptyState').style.display = 'none';
        document.getElementById('removeCoverBtn').classList.remove('hidden');
      } else {
        coverZone.style.backgroundImage = 'none';
        document.getElementById('coverEmptyState').style.display = 'block';
        document.getElementById('removeCoverBtn').classList.add('hidden');
      }
      document.getElementById('coverUploadStatus').innerHTML = '';

      /* Status banner */
      const cfg = {
        Pending:  { bg:'var(--warning-soft)', border:'var(--warning)', icon:'fa-clock',        color:'var(--warning)', text:'Profiliniz admin tərəfindən nəzərdən keçirilir.' },
        Approved: { bg:'var(--success-soft)', border:'var(--success)', icon:'fa-circle-check', color:'var(--success)', text:'Profiliniz təsdiqlənib. Müştərilər sizi görə bilər.' },
        Rejected: { bg:'var(--danger-soft)',  border:'var(--danger)',  icon:'fa-circle-xmark', color:'var(--danger)',  text:'Profiliniz rədd edildi. Məlumatları düzəldib yenidən göndərin.' },
      };
      const banner = document.getElementById('statusBanner');
      const c = cfg[p.status];
      if (c) {
        banner.style.background  = c.bg;
        banner.style.borderColor = c.border;
        banner.innerHTML = `<i class="fa-solid ${c.icon}" style="color:${c.color};font-size:1.1rem"></i><span style="font-size:var(--fs-sm)">${c.text}</span>`;
        banner.classList.remove('hidden');
        banner.style.display = 'flex';
      } else {
        banner.classList.add('hidden');
      }
      isNew = false;
    } catch {
      isNew = true;
      document.getElementById('statusBanner').classList.add('hidden');
    }
  }

  /* ── Saxla ── */
  document.getElementById('profileForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saxlanılır...';

    const dto = {
      businessName:  document.getElementById('businessName').value,
      category:      getCategoryValue(),
      description:   document.getElementById('description').value,
      address:       document.getElementById('address').value,
      latitude:      40.4093,
      longitude:     49.8671,
      imageUrl:      uploadedImageUrl || undefined,
      coverImageUrl: uploadedCoverUrl || undefined,
      phoneNumber:   document.getElementById('phoneNumber').value.trim()  || undefined,
      contactEmail:  document.getElementById('contactEmail').value.trim() || undefined,
      instagramUrl:  getSocialValue('instagramUrl', 'https://instagram.com/'),
      facebookUrl:   getSocialValue('facebookUrl',  'https://facebook.com/'),
    };

    try {
      if (isNew) await pApi.createProfile(dto);
      else       await pApi.updateProfile(dto);
      showAlert('#alertBox', 'Profil uğurla yadda saxlandı!', 'success');
      loadProfile();
    } catch(err) {
      showAlert('#alertBox', err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Yadda saxla';
    }
  });

  loadProfile();
</script>
</body>
</html>
