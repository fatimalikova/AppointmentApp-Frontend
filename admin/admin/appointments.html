<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rezervasiyalar — Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="shell">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">Rezervasiyalar</div>
        <div class="topbar-sub" id="topbarSub"></div>
      </div>
    </div>
    <div class="content">
      <div class="page-header">
        <div><h1>Bütün Rezervasiyalar</h1><p>Platformadakı bütün görüşlər</p></div>
      </div>

      <div class="filter-bar">
        <select id="statusFilter" onchange="load()">
          <option value="">Bütün statuslar</option>
          <option value="Confirmed">Təsdiqlənmiş</option>
          <option value="Completed">Tamamlanmış</option>
          <option value="Cancelled">Ləğv edilmiş</option>
        </select>
        <input type="date" id="fromDate">
        <input type="date" id="toDate">
        <button class="btn btn-primary btn-sm" onclick="load()">
          <i class="fa-solid fa-filter"></i> Filtr et
        </button>
        <button class="btn btn-ghost btn-sm" onclick="clearFilter()">
          <i class="fa-solid fa-rotate-left"></i> Sıfırla
        </button>
      </div>

      <div style="font-size:var(--fs-sm);color:var(--ink-soft);margin-bottom:var(--sp-3)" id="resultCount"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Xidmət</th>
              <th>Client</th>
              <th>Provider</th>
              <th>Tarix</th>
              <th>Saat</th>
              <th>Qiymət</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="7"><div class="spinner-wrap"><div class="spinner"></div></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Detal modal -->
<div class="overlay hidden" id="detailModal">
  <div class="modal modal-lg">
    <div class="modal-head">
      <h3><i class="fa-solid fa-calendar-check" style="color:var(--accent);margin-right:8px"></i>Rezervasiya Detalı</h3>
      <button class="btn-icon" onclick="closeModal('detailModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal('detailModal')">Bağla</button>
    </div>
  </div>
</div>

<script src="../js/admin-api.js"></script>
<script src="../js/layout.js"></script>
<script>
  async function load() {
    const tb = document.getElementById('tbody');
    tb.innerHTML = '<tr><td colspan="7"><div class="spinner-wrap"><div class="spinner"></div></div></td></tr>';

    const params = { pageSize:100 };
    const status = document.getElementById('statusFilter').value;
    const from   = document.getElementById('fromDate').value;
    const to     = document.getElementById('toDate').value;
    if (status) params.status = status;
    if (from)   params.from   = from;
    if (to)     params.to     = to;

    const data  = await aApi.getAppointments(params).catch(()=>[]);
    const items = Array.isArray(data) ? data : [];

    document.getElementById('resultCount').textContent = items.length + ' nəticə tapıldı';

    if (!items.length) {
      tb.innerHTML = '<tr><td colspan="7"><div class="empty"><i class="fa-regular fa-calendar"></i><p>Nəticə tapılmadı</p></div></td></tr>';
      return;
    }

    tb.innerHTML = items.map(a => `
      <tr style="cursor:pointer" onclick='showDetail(${JSON.stringify(a).replace(/"/g,"&quot;")})'>
        <td><strong>${a.serviceName}</strong></td>
        <td>${a.clientFullName}</td>
        <td>${a.providerBusinessName}</td>
        <td>${formatDate(a.startDateTime)}</td>
        <td>${formatTime(a.startDateTime)}</td>
        <td style="font-weight:700;color:var(--accent-dark)">${formatPrice(a.price)}</td>
        <td>${badge(a.status)}</td>
      </tr>`).join('');
  }

  function showDetail(a) {
    document.getElementById('detailBody').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)">
        ${[
          ['fa-briefcase-medical','Xidmət',   a.serviceName],
          ['fa-user',            'Client',    a.clientFullName],
          ['fa-building',        'Provider',  a.providerBusinessName],
          ['fa-calendar',        'Tarix',     formatDate(a.startDateTime,{day:'numeric',month:'long',year:'numeric'})],
          ['fa-clock',           'Başlama',   formatTime(a.startDateTime)],
          ['fa-clock',           'Bitmə',     formatTime(a.endDateTime)],
          ['fa-tag',             'Qiymət',    formatPrice(a.price)],
          ['fa-circle-dot',      'Status',    ''],
        ].map(([ic,l,v]) => `
          <div>
            <span style="font-size:var(--fs-xs);color:var(--ink-soft);display:flex;align-items:center;gap:5px;margin-bottom:3px">
              <i class="fa-solid ${ic}" style="color:var(--accent)"></i>${l}
            </span>
            <strong style="font-size:var(--fs-sm)">${l==='Status'?badge(a.status):v||'—'}</strong>
          </div>`).join('')}
      </div>
      ${a.notes ? `<div style="margin-top:var(--sp-4);padding:var(--sp-3) var(--sp-4);background:var(--surface-soft);border-radius:var(--r-sm);font-size:var(--fs-sm)">
        <i class="fa-solid fa-comment" style="color:var(--accent);margin-right:6px"></i><strong>Qeyd:</strong> ${a.notes}
      </div>` : ''}`;
    openModal('detailModal');
  }

  function clearFilter() {
    document.getElementById('statusFilter').value = '';
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = '';
    load();
  }

  load();
</script>
</body>
</html>
